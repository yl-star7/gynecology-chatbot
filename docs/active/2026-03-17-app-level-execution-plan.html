  <template id="markdown-source"># 모성간호 챗봇 코드 정렬 실행 계획

&gt; 최종 정렬일: 2026-03-25
&gt; 목적: 현재 저장소 구현 상태를 기준으로 실행 방향을 다시 고정한다.
&gt; 이 문서는 기존의 &quot;웹 중심 + Expo 래퍼&quot; 가정을 수정한 코드 기준 문서다.

## 1. 현재 기준 결정

- `apps/web`는 관리자 콘솔, 모바일 웹 화면, Next.js API route를 함께 가진다.
- `apps/mobile`은 더 이상 단순 WebView 래퍼가 아니다. Expo Router 기반 네이티브 앱 화면과 세션, 포트, 푸시 등록 흐름을 직접 가진다.
- `packages/app-core`는 모바일/관리자 도메인 타입, 포트, 테마 프리셋의 기준이다.
- `packages/db`와 `supabase/migrations`는 현재 DB 계약을 반영한다.
- 인증은 전화번호 OTP 중심이다.
- 사용자 데이터 소스는 `mock` 또는 API 기반으로 전환 가능하다.
- 관리자 데이터는 서버 세션 기반으로 보호된다.

## 2. 코드 기준 아키텍처

### 웹

- 라우트 위치: `apps/web/app`
- 역할:
  - 관리자 콘솔 화면
  - 모바일 웹 대체 화면
  - 모바일 앱이 호출하는 서버 API
  - 푸시 등록 및 스케줄 실행 진입점

### 모바일

- 라우트 위치: `apps/mobile/app`
- 역할:
  - Expo Router 기반 사용자 앱
  - 네이티브 세션 저장
  - 포트 기반 서비스 조립
  - Expo 푸시 토큰 등록

### 공용 도메인

- 위치: `packages/app-core`
- 책임:
  - `HomeViewData`, `MobileProfileViewData`, `AdminDashboardData`
  - 모바일 테마 키와 프리셋
  - web/native 공용 포트 인터페이스

### 데이터 계층

- 실제 스키마 기준:
  - `public`: 인증, 프로필, 채팅, 기록, 이벤트 로그
  - `content`: 주차별 원문, 일차 콘텐츠, 체크리스트, 질문, 미디어
- 게시용 조회는 public view를 통해 읽는다.

## 7. 기존 계획서와 달라진 핵심 포인트

### 모바일 앱 방향

- 예전 문서:
  - `apps/mobile`을 Expo 래퍼로 유지하는 가정이 강했다.
- 현재 코드:
  - 네이티브 화면이 이미 존재한다.
  - `PatientHomeScreen`, `PatientTodayScreen`, `PatientRecordsScreen` 등 네이티브 UI가 기준 축으로 올라와 있다.
  - WebView 전용 구조로 되돌리는 문서는 더 이상 맞지 않다.

### 관리자 구조

- 예전 문서:
  - 단일 대시보드 확장 중심 설명이 많았다.
- 현재 코드:
  - `operations`, `accounts`, `content`, `monitoring`으로 분리된 콘솔 구조다.
  - 사이드바 기반 탐색이 이미 고정돼 있다.

### 주차 콘텐츠 모델

- 예전 문서:
  - `pregnancy_weeks` 중심의 단순 모델 설명이 강했다.
- 현재 코드:
  - 실제 운영 모델은 `pregnancy_week_data` + `pregnancy_day_contents` + `pregnancy_week_media` + `week_checklists` + `week_questions` 조합이다.
  - 관리자 주차 상세 API도 이 구조를 전제로 patch payload를 받는다.

### 체크리스트/기록 모델

- 예전 문서:
  - 일자별 완료 로그 테이블을 별도 설계하는 방향이 강했다.
- 현재 코드:
  - 사용자 반응 추적은 `user_checklist_events`, `user_question_events` 중심이다.
  - `records` 화면은 현재 `calendar_logs`와 최근 세션 목록을 기반으로 그려진다.
  - 별도 `diary_entries` 중심 모델은 아직 현재 구현 기준이 아니다.

### 알림과 인증

- 현재 코드에 이미 존재하는 것:
  - 전화번호 OTP 시작/로그인 API
  - Expo 푸시 토큰 등록
  - proactive chat 실행 경로
- 따라서 문서는 &quot;추가 예정&quot;보다 &quot;기구현 + 확장 필요&quot;로 표현해야 한다.

## 8. 현재 코드 기준 우선 작업

### P0. 문서 정합

- `README.md`
- `docs/reference/MONOREPO_HIERARCHY.md`
- `docs/reference/IMPLEMENTATION_PLAN.md`
- 이 세 문서에서 아직 남아 있는 &quot;Expo WebView 래퍼&quot; 표현을 현재 구조 기준으로 정리한다.

### P1. 사용자 경험 정합

- web과 native에서 동일한 사용자 개념을 같은 이름으로 정리한다.
  - 홈
  - 오늘
  - 기록과 회고
  - 지식
  - 프로필
- 현재 web은 `/`, `/today`, `/knowledge`, `/notebook`이고 native는 `/home`, `/today`, `/(tabs)/knowledge`, `/(tabs)/notebook`이다.
- 라우트 명명과 정보 구조를 하나의 기준으로 다시 맞출 필요가 있다.

### P2. 기록/체크리스트 실데이터 연결

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const template = document.getElementById('markdown-source');
    const pagesRoot = document.getElementById('pages');
    const markdown = template.innerHTML;
    const rendered = marked.parse(markdown, { gfm: true, breaks: false });
    const documentTitle = document.title;
    const documentDate = '2026-03-25';

    const temp = document.createElement('div');
    temp.className = 'markdown-body';
    temp.style.position = 'absolute';
    temp.style.visibility = 'hidden';
    temp.style.pointerEvents = 'none';
    temp.style.left = '-99999px';
    temp.style.top = '0';
    temp.style.width = 'calc(210mm - 36mm)';
    temp.innerHTML = rendered;
    document.body.appendChild(temp);

    const pageHeightPx = (() => {
      const probe = document.createElement('div');
      probe.style.width = '210mm';
      probe.style.height = '297mm';
      probe.style.position = 'absolute';
      probe.style.visibility = 'hidden';
      document.body.appendChild(probe);
      const h = probe.getBoundingClientRect().height;
      probe.remove();
      return h;
    })();

    const style = getComputedStyle(document.documentElement);
    const padTop = parseFloat(style.getPropertyValue('--page-padding-top')) || 0;
    const padBottom = parseFloat(style.getPropertyValue('--page-padding-bottom')) || 0;
    const pageNumberHeight = parseFloat(style.getPropertyValue('--page-number-height')) || 0;
    const contentLimit = pageHeightPx - padTop - padBottom - pageNumberHeight - 10;

    function createPage(index) {
      const page = document.createElement('section');
      page.className = 'page';
      const inner = document.createElement('div');
      inner.className = 'page-inner';
      const header = document.createElement('div');
      header.className = 'page-header';
      const headerMeta = document.createElement('div');
      headerMeta.className = 'page-header-meta';
      const kicker = document.createElement('div');
      kicker.className = 'page-kicker';
      kicker.textContent = '과업 문서';
      const runningTitle = document.createElement('div');
      runningTitle.className = 'page-running-title';
      runningTitle.textContent = documentTitle;
      const runningDate = document.createElement('div');
      runningDate.className = 'page-running-date';
      runningDate.textContent = documentDate;
      headerMeta.appendChild(kicker);
      headerMeta.appendChild(runningTitle);
      headerMeta.appendChild(runningDate);
      const chip = document.createElement('div');
      chip.className = 'page-chip';
      chip.textContent = index === 1 ? '최신본' : '실행본';
      header.appendChild(headerMeta);
      header.appendChild(chip);
      const body = document.createElement('div');
      body.className = 'markdown-body';
      const footer = document.createElement('div');
      footer.className = 'page-number';
      footer.innerHTML = `<span>${documentTitle}</span><span>${index}쪽</span>`;
      inner.appendChild(header);
      inner.appendChild(body);
      page.appendChild(inner);
      page.appendChild(footer);
      pagesRoot.appendChild(page);
      return body;
    }

    function tooTall(pageBody) {
      return pageBody.getBoundingClientRect().height > contentLimit;
    }

    let pageIndex = 1;
    let currentBody = createPage(pageIndex);
    const nodes = Array.from(temp.childNodes);

    for (const node of nodes) {
      if (node.nodeType === Node.TEXT_NODE && !node.textContent.trim()) continue;
      const clone = node.cloneNode(true);
      if (clone.nodeType === Node.ELEMENT_NODE) {
        const tag = clone.tagName;
        if (['H1', 'H2', 'H3', 'BLOCKQUOTE', 'PRE', 'TABLE', 'UL', 'OL'].includes(tag)) {
          clone.classList.add('avoid-break');
        }
      }
      currentBody.appendChild(clone);
      if (tooTall(currentBody)) {
        currentBody.removeChild(clone);
        pageIndex += 1;
        currentBody = createPage(pageIndex);
        currentBody.appendChild(clone);
      }
    }

    const totalPages = pagesRoot.querySelectorAll('.page').length;
    pagesRoot.querySelectorAll('.page-number').forEach((footer, idx) => {
      footer.innerHTML = `<span>${documentTitle}</span><span>${idx + 1} / ${totalPages}쪽</span>`;
    });

    temp.remove();
  </script>
