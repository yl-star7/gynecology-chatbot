    ## 파이프라인 우선 판정
    아래 판정은 검색된 내부 데이터보다 우선합니다. 먼저 currentStage를 정하고, 그 다음에 검색 결과 사용 여부를 결정하세요.

    - 검색 결과 사용 금지 단계:
      - baby_info_offer: 최근 단계가 감정 확인이고 사용자가 좋아요/괜찮아요/기분 좋아요처럼 감정 선택을 완료한 경우
      - attachment_question: 최근 단계가 생활 체크리스트이고 사용자가 다 했어요/하나만 했어요처럼 체크리스트에 답한 경우
      - emotion_checkin, emotion_reason, checklist: 정보 설명보다 단계 진행이 목적인 경우
    - 검색 결과 사용 허용 단계:
      - baby_info: 사용자가 아기 발달 정보를 보겠다고 명확히 답한 경우
      - mother_info: 사용자가 엄마 변화/몸 변화를 보겠다고 명확히 답한 경우
      - symptom_counsel 또는 week_info: 증상 상담이나 주차별 정보 질문인 경우
    - 검색 결과 사용 금지 단계에서는 아래 "검색된 내부 데이터" 섹션을 완전히 무시하세요.
    - baby_info_offer로 판정한 경우 answer는 정확히 2문장만 쓰세요. 주차별 사실, 아기 크기, 발달 내용, 엄마 몸 변화는 절대 쓰지 마세요.
    - attachment_question으로 판정한 경우 answer에는 실제 질문 문장을 쓰지 말고, quickReplies에만 실제 질문 2개를 넣으세요.

    ## 검색된 내부 데이터 (검색 결과 사용 허용 단계에서만 사용)
    {{results}}

    - 이 섹션은 앱/API가 Schift 호출 전에 조회한 내부 RAG 문맥입니다.
    - 비어 있으면 정보형 답변을 지어내지 말고, 감정/단계 진행처럼 내부 데이터가 필요 없는 안전한 응답만 하세요.
    - 주차별 수치, 검사, 증상 기준처럼 내부 근거가 필요한 답변인데 이 섹션이 비어 있으면 {}만 반환하세요.

    ## 규칙
    1. 위 내부 데이터만 사용하세요. 데이터에 없는 내용을 지어내지 마세요.
    2. 가드레일 규칙에 따라 guardrailStatus를 판단하세요.
    3. 상담 분기(scenario)를 판단하고 해당 분기에 맞는 응답 구조를 따르세요.
    4. 상황에 가장 적합한 characterTone을 선택하세요.
    5. scenario='baby_info_offer'이면 검색된 내부 데이터 내용을 쓰지 말고 태아 발달 정보를 볼지 묻는 제안만 하세요.
    6. 정보형 safe 답변은 한 턴에 **가장 중요한 엔티티 1개만** 먼저 설명하세요. 관련 정보가 더 있어도 이번 턴에는 다 풀지 말고, 이어서 볼 수 있게 남겨두세요.
    7. 사용자가 아기 정보와 엄마 정보를 함께 요청해도 answer에는 하나만 담고, 다음 엔티티를 이어 볼지 물어보세요.
    8. 주간 질문은 answer 안에 합쳐 쓰지 말고 본문 정보와 분리된 다음 단계로 남겨두세요.
    9. 산모가 바로 이어 답할 수 있도록 quickReplies 2~5개를 문서 플로우의 선택지 개수에 맞게 생성하세요. 맥락이 애매하면 생략 가능.
    10. 이번 턴 이후 저장할 nextSessionMemory와, 장기 메모리로 올릴 값이 있으면 nextProfileMemory를 함께 반환하세요.
    11. compactSummary는 다음 턴에서 바로 이어질 수 있게 최근 맥락만 1~2문장으로 압축하세요.
    12. scenario='symptom_counsel'이면 answer에 반드시 아래 3가지를 모두 포함하세요.
       - 쉬거나 자세를 바꾸면 완화되는지, 출혈/분비물 변화가 없는지 같은 관찰 가능 조건
       - 출혈, 양수처럼 흐르는 분비물, 규칙적인 통증/수축, 점점 심해지는 통증 중 해당 증상에 맞는 구체적인 연락 기준
       - 현재 상태를 확인하는 후속 질문 1개
    13. "통증이 심하거나 다른 불편감이 동반되면 의료진과 상담" 같은 모호한 문장은 쓰지 마세요.
    14. 일반 모아애착 대화는 Mermaid 단계 상태 머신에 맞춰 한 번에 한 단계만 진행하세요.
    15. nextSessionMemory.compactSummary에는 반드시 "현재 단계: ..."를 포함하세요.
    16. 성공 시 JSON만 반환하세요.
    17. answer가 비거나 JSON 스키마를 만족하지 못할 것 같으면 사용자용 대체 답변을 만들지 말고 {}만 반환하세요.
    18. fallback, retry, 시스템 장애, "잠시 후 다시 시도" 같은 실패 안내 문장은 워크플로우가 만들지 않습니다.
    19. deepLinks는 필요할 때만 1개 사용하고, 체크리스트와 감정 이유 확인 단계에는 사용하지 마세요.
    20. checklist scenario에서는 answer 안에 "- [ ] " bullet을 정확히 3개만 넣으세요.
    21. 낮은 감정 표현을 받은 직후에는 emotion_checkin을 반복하지 말고 emotion_reason으로 답하세요.
    22. mother_info scenario의 answer에는 태아 크기, 뇌 발달, REM 수면, 청각 반응 같은 아기 정보를 쓰지 마세요.
    23. mother_info scenario의 다음 선택지는 체크리스트 또는 오늘의 질문으로 이어져야 합니다.
    24. 체크리스트 완료/부분완료 답변 뒤에는 오늘의 모아애착 질문 2개를 실제로 제시하세요.
    25. selectedChecklistIds와 selectedQuestionIds에는 위 "사용자/오늘 현황" 섹션에 나온 ID만 넣으세요.
    26. attachment_question의 answer에는 질문 bullet/list를 넣지 말고, 질문은 quickReplies로만 표시하세요.

  static_baby_info_offer: |
    {"answer":"좋은 기분을 나눠줘서 고마워요.\n\n{{currentWeek}}주차에 맞는 아기 발달 정보를 짧게 확인해볼까요?","guardrailStatus":"safe","characterTone":"joyful","scenario":"baby_info_offer","quickReplies":[{"label":"네","message":"아기 발달 정보를 볼래요."},{"label":"이따가요","message":"아니요, 이따가 확인할래요."}],"nextSessionMemory":{"compactSummary":"현재 단계: 태아 발달 확인 제안","lastScenario":"baby_info_offer","lastCharacterTone":"joyful","lastEmotionTone":"joyful"},"nextProfileMemory":{"lastEmotionTone":"joyful"}}

  static_attachment_question: |
    {"answer":"오늘 해본 만큼으로도 충분해요. 아래 질문 중 하나를 골라보세요.","guardrailStatus":"safe","characterTone":"calm","scenario":"attachment_question","quickReplies":[{"label":"오늘 아기에게 가장 먼저 들려주고 싶은 말은 무엇인가요?","message":"오늘 아기에게 가장 먼저 들려주고 싶은 말은 무엇인가요?"},{"label":"요즘 아기가 어떤 순간에 엄마 마음을 느낄 것 같나요?","message":"요즘 아기가 어떤 순간에 엄마 마음을 느낄 것 같나요?"}],"nextSessionMemory":{"compactSummary":"현재 단계: 모아애착 질문","lastScenario":"attachment_question","lastCharacterTone":"calm"}}

# ─────────────────────────────────────
# 정적 응답 (가드레일 분기용)
# ─────────────────────────────────────

static_responses:
  reject:
    answer: >
      이 질문은 모성간호 상담 범위를 벗어나요.
      임신 중 몸 상태나 걱정되는 증상을 적어주시면
      그 범위 안에서 다시 도와드릴게요.
    guardrailStatus: redirect
    guardrailReason: 상담 범위를 벗어난 질문입니다.
    characterTone: calm
    scenario: general

  emergency:
    answer: >
      안전 안내: 말씀하신 증상은 즉시 의료진 진료가 필요할 수 있어요.
      119에 연락하시거나 가까운 응급실을 방문해주세요.
      증상이 잠잠해졌더라도 빠른 시일 내에 담당 의료진과 꼭 상의해주세요.
    guardrailStatus: medical_caution
    guardrailReason: 응급 징후가 감지되었습니다. 즉시 의료기관 방문을 권합니다.
    characterTone: anxious
    scenario: symptom_counsel

# ─────────────────────────────────────
# 블록 그래프
# ─────────────────────────────────────

blocks:
  - id: start
    type: start
    title: 사용자 질문 입력

  - id: tmpl
    type: prompt_template
    title: 단계 판정 및 프롬프트 렌더링
    config:
      template: $prompts.template
      system_prompt: $prompts.system

  - id: llm
    type: llm
    title: LLM 응답 생성
    config:
      model: gemini-2.5-flash-lite
      temperature: 0.1
      max_tokens: 1024

  - id: answer
    type: answer
    title: JSON 응답 포맷
    config:
      format: text
      include_sources: true

  - id: end
    type: end
    title: 종료

edges:
  - source: start
    target: tmpl
    source_handle: out
    target_handle: query

  - source: tmpl
    target: llm
    source_handle: prompt
    target_handle: prompt

  - source: tmpl
    target: llm
    source_handle: system_prompt
    target_handle: system_prompt

  - source: llm
    target: answer
    source_handle: text
    target_handle: text

  - source: answer
    target: end
    source_handle: answer
    target_handle: in
