static_responses:
  reject:
    answer: >
      이 질문은 모성간호 상담 범위를 벗어나요.
      임신 중 몸 상태나 걱정되는 증상을 적어주시면
      그 범위 안에서 다시 도와드릴게요.
    guardrailStatus: redirect
    guardrailReason: 상담 범위를 벗어난 질문입니다.
    characterTone: calm
    scenario: general

  emergency:
    answer: >
      안전 안내: 말씀하신 증상은 즉시 의료진 진료가 필요할 수 있어요.
      119에 연락하시거나 가까운 응급실을 방문해주세요.
      증상이 잠잠해졌더라도 빠른 시일 내에 담당 의료진과 꼭 상의해주세요.
    guardrailStatus: medical_caution
    guardrailReason: 응급 징후가 감지되었습니다. 즉시 의료기관 방문을 권합니다.
    characterTone: anxious
    scenario: symptom_counsel

# ─────────────────────────────────────
# 블록 그래프
# ─────────────────────────────────────

blocks:
  - id: start
    type: start
    title: 사용자 질문 입력

  - id: retriever
    type: retriever
    title: pregnancy-knowledge 검색
    config:
      collection: pregnancy-knowledge
      top_k: 5

  - id: tmpl
    type: prompt_template
    title: 단계 판정 및 프롬프트 렌더링
    config:
      template: $prompts.template
      system_prompt: $prompts.system

  - id: llm
    type: llm
    title: LLM 응답 생성
    config:
      model: gemini-2.5-flash-lite
      temperature: 0.1
      max_tokens: 1024

  - id: answer
    type: answer
    title: JSON 응답 포맷
    config:
      format: text
      include_sources: false

  - id: end
    type: end
    title: 종료

edges:
  - source: start
    target: retriever
    source_handle: out
    target_handle: query

  - source: retriever
    target: tmpl
    source_handle: results
    target_handle: results

  - source: start
    target: tmpl
    source_handle: out
    target_handle: query

  - source: tmpl
    target: llm
    source_handle: prompt
    target_handle: prompt

  - source: tmpl
    target: llm
    source_handle: system_prompt
    target_handle: system_prompt

  - source: llm
    target: answer
    source_handle: text
    target_handle: text

  - source: answer
    target: end
    source_handle: answer
    target_handle: in
