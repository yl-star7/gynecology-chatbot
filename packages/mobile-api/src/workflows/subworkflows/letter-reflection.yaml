version: 1
name: 모성간호 letter_reflection (편지/공감 대화)
description: >
  stage=2 전용. 사용자가 오늘의 질문에 답변 중. 편지형 공감 + 역질문 1개.
  stage=0 회귀 절대 금지.

admin_metadata:
  stage: "2"
  scenario: letter_reflection
  model_name: gemini-2.5-flash-lite

prompts:
  system: |
    당신은 임산부의 편지/공감 대화 파트너입니다.

    규칙:
    - answer: 공감 1문단(2~3문장) + 의미화 1문장 + 열린 역질문 1개. 총 3~5문장.
    - **금지**: "주차 정보 궁금하세요?", "아기 발달 정보 짧게 확인", "오늘 기분 어떠세요" stage=0 문구.
    - **금지**: scenario="baby_info_offer"/"mood_intake"/"emotion_checkin". stage=0 회귀 불가.
    - scenario: letter_reflection / daily_followup / empathy_chat 중 하나.
    - quickReplies 기본 생략 (사용자가 막힐 때만 2~3개 보조).
    - 마무리 신호("고마워요","괜찮아졌어요","여기까지"): 짧은 공감 + compactSummary="현재 단계: 질문 답변 종료 신호". stage=2 유지.
    - 일반 턴: nextSessionMemory = { stage:2, stageName:"choice_conversation", compactSummary:"현재 단계: 편지 공감 대화", lastScenario:"letter_reflection", lastCharacterTone:"calm", currentAttachmentQuestionId:"{{currentAttachmentQuestionId}}" }
    - guardrailStatus:"safe". 우울/슬픔 → characterTone="sad", 불안 → "anxious".
    - -어요/-해요 체. 진단 확정 금지.

    응답은 JSON 하나만. 마크다운 코드블록 금지.

  template: |
    현재 대화 중인 질문 ID: {{currentAttachmentQuestionId}}
    이전 대화 요약: {{compactSummary}}
    압축 대화 로그: {{compressedLog}}
    오늘 답변한 질문 수: {{answeredCount}}/3

    사용자 메시지:
    {{query}}

blocks:
  - id: start
    type: start
    title: 입력
  - id: tmpl
    type: prompt_template
    title: 프롬프트 렌더
    config:
      system_prompt: $prompts.system
      template: $prompts.template
  - id: llm
    type: llm
    title: 공감 LLM
    config:
      model: gemini-2.5-flash-lite
      temperature: 0.3
      max_tokens: 500
      thinking_budget: 0
  - id: answer
    type: answer
    title: JSON 출력
    config:
      format: text
      include_sources: false
  - id: end
    type: end
    title: 종료

edges:
  - { source: start,  target: tmpl,   source_handle: out,           target_handle: query }
  - { source: tmpl,   target: llm,    source_handle: prompt,        target_handle: prompt }
  - { source: tmpl,   target: llm,    source_handle: system_prompt, target_handle: system_prompt }
  - { source: llm,    target: answer, source_handle: text,          target_handle: text }
  - { source: answer, target: end,    source_handle: answer,        target_handle: in }
