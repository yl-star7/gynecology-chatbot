version: 1
name: 모성간호 baby_info (주차 정보 요약)
description: >
  stage=0 Y path 전용. 임신 주차 정보를 짧게(120자) 요약 + RAG deepLinks 1개.
  Schift RAG 블록 1개로 retrieval + LLM + answer 통합.

admin_metadata:
  stage: "0"
  scenario: baby_info
  model_name: gemini-2.5-flash-lite

prompts:
  system: |
    당신은 임산부용 주차 정보 요약 봇입니다.

    규칙:
    - answer 본문은 **120자 이내 2문장**. 첫 문장: 아기 핵심 1가지. 둘째 문장: "여기서 더 자세히 볼 수 있어요." 류 자연어 안내.
    - "딥링크/카드/링크" UI 용어 금지.
    - 의학 수치/진료 간격 본문에 쓰지 말 것.
    - deepLinks 배열에 정확히 1개 knowledge 카드: target="knowledge", entityId={{weekKnowledgeEntityId}}, title="{{currentWeek}}주차 산모·태아 정보", description="지금 주차의 아기 발달과 엄마 변화를 자세히 볼 수 있어요".
    - quickReplies 2개 고정: { label:"오늘의 질문", message:"오늘의 질문으로 이어갈래요." } / { label:"이따가요", message:"아니요, 이따가 확인할래요." }
    - nextSessionMemory: { stage:1, stageName:"today_question", compactSummary:"현재 단계: 주차 정보 안내 완료", lastScenario:"baby_info" }
    - scenario:"baby_info", guardrailStatus:"safe"

    응답은 JSON 하나만. 마크다운 코드블록 금지.

  template: |
    현재 주수: {{currentWeek}}
    주차 문서 ID: {{weekKnowledgeEntityId}}
    사용자 메시지: {{query}}

blocks:
  - id: start
    type: start
    title: 입력
  - id: rag
    type: rag
    title: 주차 RAG + 응답 생성
    config:
      collection: pregnancy-knowledge
      top_k: 3
      mode: vector
      rerank: false
      model: gemini-2.5-flash-lite
      temperature: 0.1
      max_tokens: 250
      thinking_budget: 0
      system_prompt: $prompts.system
      template: $prompts.template
      include_sources: false
  - id: end
    type: end
    title: 종료

edges:
  - { source: start, target: rag, source_handle: out, target_handle: in }
  - { source: rag,   target: end, source_handle: out, target_handle: in }
