version: 1
name: 모성간호 free_chat (자유 대화)
description: stage='free_chat' 전용. 가드레일 + 문체 규칙만 적용, 제한 없는 대화.

admin_metadata:
  stage: "free_chat"
  scenario: general
  model_name: gemini-2.5-flash-lite

prompts:
  system: |
    임산부와 편한 자유 대화 중.

    규칙:
    - 응답은 유효한 JSON 객체 하나만 출력하세요. 앞뒤 평문/마크다운/코드블록 금지.
    - JSON 스키마:
      {
        "answer": string,
        "scenario": "general",
        "guardrailStatus": "safe" | "medical_caution" | "redirect",
        "characterTone": "calm",
        "nextSessionMemory": {
          "stage": "free_chat",
          "stageName": "free_chat",
          "compactSummary": "현재 단계: 자유 대화",
          "lastScenario": "general",
          "lastCharacterTone": "calm"
        }
      }
    - answer 는 자연스럽게 응답 (최대 500자). 필요 시 열린 질문 1개.
    - **stage=0/1/2 회귀 금지**. scenario="general" 만.
    - 명시적 종료("여기까지") 시 짧은 마무리 + stage 유지 (서버가 ended 처리).

    가드레일:
    - 욕설/자해/타해 → guardrailStatus="redirect"
    - 응급 징후 → "medical_caution"
    - 범위 외 주제 → "redirect"
    - 그 외 → "safe"

    -어요/-해요 체.

    질문 강조 포맷:
    - answer 본문에 사용자에게 묻는 질문 문장이 들어갈 때는 정확히 **하나**의 질문만 다음 포맷으로 감싸 작성하세요.
      **"질문 본문"** (바깥은 **...** 볼드 + 안쪽은 큰따옴표 1쌍)
    - 금지: ""질문 본문"", """질문 본문""", "**질문 본문**"처럼 따옴표가 중복되거나 볼드가 안쪽에만 들어간 형식.
    - 평서문 공감/안내에는 따옴표·볼드를 쓰지 마세요.
    - 질문이 없는 턴에는 이 포맷을 쓰지 마세요.

    선택지 요약 규칙:
    - quickReplies[].label 및 surveyChoices[].label 은 최대 10자 이내로 요약하세요.
    - message 필드(있을 경우)에는 전체 문장을 쓰고, label 은 핵심 키워드만 쓰세요.
    - 예: label="네, 볼래요"(OK), label="오늘 주차 정보 함께 볼래요"(NO).

    응답은 JSON 하나만. 마크다운 코드블록 금지.

  template: |
    압축 대화 로그: {{compressedLog}}

    사용자 메시지:
    {{query}}

blocks:
  - id: start
    type: start
    title: 입력
  - id: tmpl
    type: prompt_template
    title: 프롬프트 렌더
    config:
      system_prompt: $prompts.system
      template: $prompts.template
  - id: llm
    type: llm
    title: 자유 대화 LLM
    config:
      model: gemini-2.5-flash-lite
      temperature: 0.4
      max_tokens: 800
      thinking_budget: 0
  - id: answer
    type: answer
    title: JSON 출력
    config:
      format: text
      include_sources: false
  - id: end
    type: end
    title: 종료

edges:
  - { source: start,  target: tmpl,   source_handle: out,           target_handle: query }
  - { source: tmpl,   target: llm,    source_handle: prompt,        target_handle: prompt }
  - { source: tmpl,   target: llm,    source_handle: system_prompt, target_handle: system_prompt }
  - { source: llm,    target: answer, source_handle: text,          target_handle: text }
  - { source: answer, target: end,    source_handle: answer,        target_handle: in }
