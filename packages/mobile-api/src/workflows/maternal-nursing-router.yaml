version: 2
name: 대화 단계 분류
description: >
  보존용 router workflow. 실제 모바일 서버는 DB system_config.workflow_stage_mapping과
  workflow_definitions의 GCS 위치를 기준으로 실행한다.
  deterministic 단계 문구와 선택지는 maternal-nursing.yaml의 chat_flow가 담당한다.

admin_metadata:
  trigger: 대화 단계 선택
  model_name: gemini-3.1-flash-lite

# ─────────────────────────────────────
# 전역 설정
# ─────────────────────────────────────
config:
  calendar_summary_webhook_url: ""
  calendar_summary_webhook_secret: ""
  wf_baby_info: ""
  wf_letter: ""
  wf_free_chat: ""
  wf_general: ""

# ─────────────────────────────────────
# 블록 그래프
# ─────────────────────────────────────
blocks:
  - id: start
    type: start
    title: 사용자 질문 받기

  - id: stage_router
    type: router
    title: 대화 목적 고르기
    config:
      routes: [baby_info, letter, free_chat, fallback]
      expression: |
        workflowStage === "free_chat" ? "free_chat"
        : (workflowStage === 0 && /네|볼래|보여|궁금/.test(query || "")) ? "baby_info"
        : (workflowStage === 2 && currentAttachmentQuestionId) ? "letter"
        : "fallback"

  - id: sub_baby_info
    type: subworkflow
    title: 주차 정보 답변으로 보내기
    config:
      workflow_id: $config.wf_baby_info
      input_mapping:
        currentWeek: "$.currentWeek"
        query: "$.query"
        weekKnowledgeEntityId: "$.weekKnowledgeEntityId"
      output_mapping:
        "*": "result"

  - id: sub_letter
    type: subworkflow
    title: 오늘 질문 공감 답변으로 보내기
    config:
      workflow_id: $config.wf_letter
      input_mapping:
        query: "$.query"
        compactSummary: "$.compactSummary"
        currentAttachmentQuestionId: "$.currentAttachmentQuestionId"
        answeredCount: "$.answeredCount"
        compressedLog: "$.compressedLog"
      output_mapping:
        "*": "result"

  - id: sub_free_chat
    type: subworkflow
    title: 자유 상담으로 보내기
    config:
      workflow_id: $config.wf_free_chat
      input_mapping:
        query: "$.query"
        compressedLog: "$.compressedLog"
      output_mapping:
        "*": "result"

  - id: sub_general
    type: subworkflow
    title: 기본 안내로 보내기
    config:
      workflow_id: $config.wf_general
      input_mapping:
        query: "$.query"
        currentWeek: "$.currentWeek"
        workflowStage: "$.workflowStage"
        lastScenario: "$.lastScenario"
        compressedLog: "$.compressedLog"
      output_mapping:
        "*": "result"

  - id: merge
    type: merge
    title: 답변 하나로 모으기
    config:
      strategy: first_non_null

  - id: summary_webhook
    type: outbound_webhook
    title: calendar 요약 기록 발송
    config:
      url: $config.calendar_summary_webhook_url
      headers:
        Authorization: "Bearer $config.calendar_summary_webhook_secret"
        Content-Type: application/json

  - id: end
    type: end
    title: 종료

edges:
  - {
      source: start,
      target: stage_router,
      source_handle: out,
      target_handle: in,
    }

  # router → 각 subworkflow
  - {
      source: stage_router,
      target: sub_baby_info,
      source_handle: baby_info,
      target_handle: in,
    }
  - {
      source: stage_router,
      target: sub_letter,
      source_handle: letter,
      target_handle: in,
    }
  - {
      source: stage_router,
      target: sub_free_chat,
      source_handle: free_chat,
      target_handle: in,
    }
  - {
      source: stage_router,
      target: sub_general,
      source_handle: fallback,
      target_handle: in,
    }

  # 각 subworkflow → merge
  - {
      source: sub_baby_info,
      target: merge,
      source_handle: out,
      target_handle: in_0,
    }
  - {
      source: sub_letter,
      target: merge,
      source_handle: out,
      target_handle: in_1,
    }
  - {
      source: sub_free_chat,
      target: merge,
      source_handle: out,
      target_handle: in_2,
    }
  - {
      source: sub_general,
      target: merge,
      source_handle: out,
      target_handle: in_3,
    }

  # merge → outbound webhook + end (fanout)
  - {
      source: merge,
      target: summary_webhook,
      source_handle: out,
      target_handle: body,
    }
  - { source: merge, target: end, source_handle: out, target_handle: in }
