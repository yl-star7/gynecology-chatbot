<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; background: #f8f4f6; width: 414px; height: 896px; overflow: hidden; display: flex; flex-direction: column; }
.status-bar { width: 100%; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #fff; }
.status-time { font-size: 15px; font-weight: 600; }
.status-icons { display: flex; gap: 6px; font-size: 13px; }
.nav-bar { background: #fff; padding: 12px 20px 14px; border-bottom: 1px solid #f0e8ec; display: flex; align-items: center; }
.nav-back { font-size: 20px; margin-right: 12px; color: #d76c8a; }
.nav-title { font-size: 18px; font-weight: 700; color: #333; }
.messages { flex: 1; padding: 20px; overflow: hidden; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 80%; padding: 14px 18px; border-radius: 18px; font-size: 15px; line-height: 1.6; }
.msg-user { background: #d76c8a; color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
.msg-bot { background: #fff; color: #444; align-self: flex-start; border-bottom-left-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
.msg-bot-name { font-size: 13px; color: #999; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.bot-avatar { width: 28px; height: 28px; background: linear-gradient(135deg, #f6b8c9, #e8a0b5); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.bot-wrap { display: flex; flex-direction: column; }
.input-bar { background: #fff; padding: 12px 16px 32px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #f0e8ec; }
.input-field { flex: 1; height: 44px; background: #f5f0f2; border: none; border-radius: 22px; padding: 0 18px; font-size: 15px; color: #333; }
.send-btn { width: 44px; height: 44px; background: linear-gradient(135deg, #d76c8a, #c45a78); border: none; border-radius: 22px; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="status-bar">
  <span class="status-time">9:41</span>
  <span class="status-icons">📶 📡 🔋</span>
</div>
<div class="nav-bar">
  <span class="nav-back">‹</span>
  <span class="nav-title">AI 상담</span>
</div>
<div class="messages">
  <div class="bot-wrap">
    <div class="msg-bot-name"><div class="bot-avatar">👶</div> 아가야</div>
    <div class="msg msg-bot">안녕하세요, 예림님! 😊<br>28주차에 접어드셨군요. 궁금한 점이 있으시면 편하게 물어보세요.</div>
  </div>
  <div class="msg msg-user">요즘 허리가 너무 아파요. 괜찮은 건가요?</div>
  <div class="bot-wrap">
    <div class="msg-bot-name"><div class="bot-avatar">👶</div> 아가야</div>
    <div class="msg msg-bot">임신 28주차에 허리 통증은 매우 흔한 증상이에요. 자궁이 커지면서 무게 중심이 앞으로 이동하기 때문이에요.<br><br>다음을 시도해 보세요:<br>• 바른 자세 유지하기<br>• 옆으로 누워서 쿠션 받치기<br>• 가벼운 스트레칭<br><br>통증이 심하거나 규칙적이면 담당 의사와 상담해 주세요. 💛</div>
  </div>
  <div class="msg msg-user">감사해요! 스트레칭 방법 좀 알려주세요</div>
</div>
<div class="input-bar">
  <input class="input-field" placeholder="메시지를 입력하세요">
  <button class="send-btn">↑</button>
</div>
</body>
</html>
