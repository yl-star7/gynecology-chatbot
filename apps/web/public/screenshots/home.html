<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; background: #fff7fb; width: 414px; height: 896px; overflow: hidden; }
.status-bar { width: 100%; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.status-time { font-size: 15px; font-weight: 600; }
.status-icons { display: flex; gap: 6px; font-size: 13px; }
.header { padding: 8px 24px 20px; }
.greeting { font-size: 24px; font-weight: 700; color: #333; }
.greeting-sub { font-size: 15px; color: #888; margin-top: 4px; }
.week-card { margin: 0 20px; background: linear-gradient(135deg, #f6b8c9, #e8a0b5); border-radius: 20px; padding: 24px; color: #fff; }
.week-label { font-size: 14px; opacity: 0.9; }
.week-num { font-size: 36px; font-weight: 800; margin: 4px 0; }
.week-desc { font-size: 14px; opacity: 0.85; line-height: 1.5; }
.week-emoji { font-size: 48px; position: absolute; right: 36px; margin-top: -60px; }
.section { padding: 24px 20px 12px; }
.section-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 16px; }
.checklist { background: #fff; border-radius: 14px; margin: 0 20px; padding: 4px 0; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
.check-item { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #f5f5f5; font-size: 15px; color: #444; }
.check-item:last-child { border-bottom: none; }
.check-circle { width: 24px; height: 24px; border-radius: 12px; border: 2px solid #d76c8a; margin-right: 14px; flex-shrink: 0; }
.check-circle.done { background: #d76c8a; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; }
.tab-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 83px; background: #fff; border-top: 1px solid #eee; display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; }
.tab { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #aaa; gap: 4px; }
.tab.active { color: #d76c8a; }
.tab-icon { font-size: 22px; }
</style>
</head>
<body>
<div class="status-bar">
  <span class="status-time">9:41</span>
  <span class="status-icons">📶 📡 🔋</span>
</div>
<div class="header">
  <div class="greeting">안녕하세요, 예림님 🤰</div>
  <div class="greeting-sub">오늘도 건강한 하루 보내세요</div>
</div>
<div class="week-card" style="position: relative;">
  <div class="week-label">임신</div>
  <div class="week-num">28주 3일</div>
  <div class="week-desc">아기가 눈을 뜨고 감을 수 있어요.<br>빛에 반응하기 시작해요.</div>
  <div class="week-emoji">🍈</div>
</div>
<div class="section">
  <div class="section-title">오늘의 체크리스트</div>
</div>
<div class="checklist">
  <div class="check-item"><div class="check-circle done">✓</div>엽산제 복용하기</div>
  <div class="check-item"><div class="check-circle done">✓</div>물 8잔 마시기</div>
  <div class="check-item"><div class="check-circle"></div>가벼운 산책 30분</div>
  <div class="check-item"><div class="check-circle"></div>태동 횟수 기록하기</div>
</div>
<div class="tab-bar">
  <div class="tab active"><span class="tab-icon">🏠</span>홈</div>
  <div class="tab"><span class="tab-icon">📅</span>오늘</div>
  <div class="tab"><span class="tab-icon">💬</span>상담</div>
  <div class="tab"><span class="tab-icon">📖</span>정보</div>
  <div class="tab"><span class="tab-icon">👤</span>설정</div>
</div>
</body>
</html>
