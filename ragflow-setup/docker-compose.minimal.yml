version: '3.8'

services:
  # 핵심 백엔드 API (프론트엔드 제거)
  ragflow-api:
    image: infiniflow/ragflow:latest
    container_name: ragflow-api
    restart: unless-stopped
    ports:
      - "9380:9380"  # API 포트만 노출
    environment:
      - DATABASE_TYPE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=infiniflow
      - MYSQL_DATABASE=ragflow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_USER=root
      - MINIO_PASSWORD=password
      - ES_HOST=elasticsearch
      - ES_PORT=9200
    depends_on:
      - mysql
      - redis
      - minio
      - elasticsearch
    volumes:
      - ./service_conf.yaml:/ragflow/conf/service_conf.yaml
      - ./documents:/ragflow/rag/documents
    command: ["python", "api/ragflow_server.py"]

  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: ragflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: infiniflow
      MYSQL_DATABASE: ragflow
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: ragflow-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # MinIO 객체 스토리지
  minio:
    image: minio/minio:latest
    container_name: ragflow-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Elasticsearch 검색 엔진
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ragflow-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - xpack.security.enabled=false
      - "http.cors.enabled=true"
      - "http.cors.allow-origin=*"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  mysql_data:
  redis_data:
  minio_data:
  es_data:

networks:
  default:
    name: ragflow-network