version: 1
name: maternal_chat_flow
description: 산모 챗봇 대화 플로우 (stage 기반)

# ---------------------------------------------------------------
# 공용 컨텍스트 — 모든 stage 에서 유지/재주입
# ---------------------------------------------------------------
context:
  keep:
    - user_mood            # stage 0 에서 수집
    - pregnancy_week_info  # 주차 정보
    - user_profile         # 유저 정보
    - session_memory       # 누적 세션 메모리

# ---------------------------------------------------------------
# 문구 풀 (랜덤 선택용)
# ---------------------------------------------------------------
copy_pools:
  mood_prompt:
    count: ~20
    sample:
      - "오늘 기분은 어떠세요?"
      - "지금 마음은 어떠세요?"
      - "오늘 하루 컨디션 어때요?"

  week_info_prompt:
    count: ~20
    sample:
      - "오늘 주차의 산모/태아 정보가 궁금하세요?"
      - "이번 주 우리 아가 소식 볼래요?"
      - "이번 주 엄마·아가 정보 같이 볼까요?"

# ---------------------------------------------------------------
# Stage 정의
# ---------------------------------------------------------------
stages:

  # -------------------------------------------------------------
  # stage 0 : 진입 / 기분 수집 / 주차 정보 분기
  # -------------------------------------------------------------
  - id: 0
    name: entry_mood
    on_enter:
      - action: render_message
        from_pool: mood_prompt

      - action: render_choices
        prompt: "기분 선택"
        choices_source: mood_options   # 기분 premade 목록
        choice_kind: mood

    on_choice:
      # 기분 선택 즉시 처리
      - action: set_context
        key: user_mood
        value: "{{choice.value}}"

      # webhook 은 비동기로 발사하고 대기하지 않음
      - action: webhook_async
        target: session_memory_ingest
        payload:
          mood: "{{context.user_mood}}"
          user: "{{context.user_profile}}"
        notes:
          - "세션 메모리 적재"
          - "mood 를 필수로 주입"
          - "이후 말투/응답톤은 mood 기반으로 고정"

      # 주차 정보 여부 질문
      - action: render_choices
        prompt_from_pool: week_info_prompt
        choices:
          - { id: yes, label: "네, 보여주세요" }
          - { id: no,  label: "괜찮아요, 건너뛸래요" }

    transitions:
      - when: "choice.id == 'yes'"
        do:
          - action: show_deep_link
            target: pregnancy_week_info
          - action: show_bottom_sheet
            target: pregnancy_week_info
          - action: prefetch_background
            target: today_question     # 오늘의 질문 미리 준비
          - goto: 1

      - when: "choice.id == 'no'"
        do:
          - goto: 1

  # -------------------------------------------------------------
  # stage 1 : 오늘의 질문 제시 (선택지로만 나감)
  # -------------------------------------------------------------
  - id: 1
    name: today_question
    on_enter:
      - action: set_stage
        value: 1

      - action: render_today_question
        delivery: choices               # ← 반드시 선택지로 출력
        require_choices: true
        min_choices: 2
        example_shape:
          question: "{{today_question.text}}"
          choices:
            - { id: "{{choice_1.id}}", label: "{{choice_1.label}}" }
            - { id: "{{choice_2.id}}", label: "{{choice_2.label}}" }

    on_choice:
      - action: set_context
        key: today_question_choice
        value: "{{choice.id}}"

      - goto: 2

  # -------------------------------------------------------------
  # stage 2 : 선택지 기반 대화 (workflow 재실행 금지, 바로 inference)
  # -------------------------------------------------------------
  - id: 2
    name: choice_conversation
    on_enter:
      - action: set_stage
        value: 2

    inference:
      skip_workflow_rerun: true         # 이전 workflow 다시 타지 않음
      direct_inference: true            # stage == 2 이면 바로 추론
      inject_context:
        - user_mood
        - pregnancy_week_info
        - user_profile
        - session_memory
        - today_question_choice

    on_turn_end:
      - action: check_question_exhausted
        on_true:
          - goto: question_end_prompt

  # -------------------------------------------------------------
  # 1차 질문 흐름 종료 — 2차 질문 여부
  # -------------------------------------------------------------
  - id: question_end_prompt
    name: ask_second_question
    on_enter:
      - action: render_choices
        prompt: "2차 질문 할래요? 아니면 다음에 할래요?"
        choices:
          - { id: second_q, label: "2차 질문 할래요" }
          - { id: later,    label: "다음에 할래요" }

    transitions:
      - when: "choice.id == 'later'"
        do:
          - goto: end

      - when: "choice.id == 'second_q'"
        do:
          - goto: second_question_loop

  # -------------------------------------------------------------
  # 2차 질문 — stage 1 → 2 흐름 반복
  # -------------------------------------------------------------
  - id: second_question_loop
    name: second_question
    on_enter:
      - action: repeat_flow
        stages: [1, 2]
        notes:
          - "오늘의 질문/선택지 대화 흐름을 동일하게 재사용"

    on_turn_end:
      - action: check_question_exhausted
        on_true:
          - goto: free_chat_prompt

  # -------------------------------------------------------------
  # 자유 대화 진입 여부
  # -------------------------------------------------------------
  - id: free_chat_prompt
    name: ask_free_chat
    on_enter:
      - action: render_choices
        prompt: "자유롭게 대화해볼래요? 여기까지 할래요?"
        choices:
          - { id: free_chat, label: "자유롭게 대화할래요" }
          - { id: stop,      label: "여기까지 할래요" }

    transitions:
      - when: "choice.id == 'stop'"
        do:
          - goto: end

      - when: "choice.id == 'free_chat'"
        do:
          - goto: free_chat

  # -------------------------------------------------------------
  # 자유 대화 모드 (무제한)
  # -------------------------------------------------------------
  - id: free_chat
    name: free_chat
    on_enter:
      - action: set_stage
        value: free_chat

      - action: compress_conversation_log
        target: session_memory

      - action: inject_context
        include:
          - user_mood
          - pregnancy_week_info
          - user_profile
          - session_memory

    mode:
      type: general_chat
      limit: none                       # NO LIMIT

  # -------------------------------------------------------------
  # 종료 — 요약 트리거
  # -------------------------------------------------------------
  - id: end
    name: end_session
    on_enter:
      - action: emit_trigger
        target: summary_pipeline
        payload:
          session_id: "{{session.id}}"
          user_mood: "{{context.user_mood}}"
          transcript: "{{session.transcript}}"
      - action: terminate_session

# ---------------------------------------------------------------
# 규칙 요약
# ---------------------------------------------------------------
rules:
  - "오늘의 질문(stage 1)은 반드시 선택지 형태로만 출력된다 (free text 금지)"
  - "stage == 2 이면 workflow 재실행 없이 바로 inference"
  - "mood 는 stage 0 에서 수집 후 이후 모든 turn 에 주입"
  - "webhook 은 async, 응답을 기다리지 않는다"
  - "종료 시 summary 트리거를 반드시 발사한다"
